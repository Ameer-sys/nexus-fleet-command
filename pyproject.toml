[project]
name = "bb-sim"
version = "0.1.0"
description = "Local MuJoCo playback for BracketBot balance policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "glfw==2.10.2",
    "mujoco==3.8.1",
    "numpy==2.5.3",
    "onnx==1.22.0",
    "onnxruntime==1.30.0",
    "pillow==12.3.0",
    "pyopengl==3.1.10",
    "scipy==1.18.1",
    "trimesh==4.12.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["assets", "outputs", "validation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
